repos:
  # Generic pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict
      - id: trailing-whitespace
        # insta snapshots and the FakeTd fixtures are compared byte for byte,
        # and the recording is generated.
        exclude: '\.(snap|jsonl|cast)$'
      - id: end-of-file-fixer
        exclude: '\.(snap|jsonl|cast)$'
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
      - id: check-added-large-files
        name: check for added large files
        description: Prevents giant files from being committed
        args: ["--maxkb=500"]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2

  # Run the mise-pinned tools rather than copies pre-commit would build, so
  # the hooks and CI agree on the versions.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: mise exec -- cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: actionlint
        name: actionlint
        entry: mise exec -- actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
