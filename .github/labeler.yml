# Pure domain: state, update(), TDLib boundary types, telemetry schema
core:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/core/**"

# Rendering: views, message layout, layout cache, theme, input mapping
ui:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/ui/**"

# Composition root: the binary, config, dispatcher, TdlibRuntime, telemetry wiring
app:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/app/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

# Build, release, and CI plumbing
ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - ".mise.toml"
          - "scripts/**"
          - "rust-toolchain.toml"
          - ".release-please-config.json"
          - ".release-please-manifest.json"
          - ".pre-commit-config.yaml"
          - ".markdownlint-cli2.yaml"
          - ".yamllint.yaml"
          - ".editorconfig"
          - "codecov.yml"
          - "renovate.json"

# The docs site's build: VuePress config, theme and dependencies
docs-site:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/.vuepress/**"
          - "docs/package.json"
          - "docs/bun.lock"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/*/tests/**"
          - "**/snapshots/**"
