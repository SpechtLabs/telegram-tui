name: Release

# release-please keeps a release PR open against main, accumulating the
# conventional commits merged since the last tag. Merging that PR tags the
# release and publishes the notes; this workflow then builds the macOS binary
# and attaches it.
#
# Versioning is pre-1.0 (see .release-please-config.json): breaking changes
# bump the minor, everything else bumps the patch.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build or repair (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

# A new push supersedes the run in flight. The three-platform matrix is not
# cheap even when it is free — macOS runners bill at 10x and Windows at 2x on
# private repos — and a superseded run proves nothing about the current head.
# Releases are exempt: cancelling one half-way could leave a tag published
# with no binary attached to it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.event_name == 'push'
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}

  publish:
    name: Build & Attach Binary
    runs-on: macos-15
    needs: [ci, release-please]
    if: >-
      always() &&
      needs.ci.result == 'success' &&
      (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.6.10
          install: true
          cache: true

      # Deliberately a different key from ci.yml's. Sharing one means restoring
      # ~1.3 GB of debug artifacts this job cannot use, and then skipping the
      # save because CI already claimed the key, so target/release would never
      # persist across releases. The last restore-key still falls back to CI's
      # cache, which is worth having on a cold first run for the registry (the
      # downloaded TDLib lives there).
      - name: Cache cargo registry and release target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      # Builds the release binary, lays out bin/ + lib/, rewrites the dylib
      # install name to @rpath, and proves the result runs from a moved
      # directory before it is allowed to ship (architecture.md §9.2).
      - name: Package
        run: mise run package

      # A tag whose binary reports a different version means the Cargo.toml
      # bump did not land. Fail loudly rather than shipping a mislabeled
      # artifact.
      - name: Verify binary version matches the tag
        run: |
          set -euo pipefail
          built="$(dist/tgt/bin/tgt --version | awk '{print $2}')"
          expected="${TAG#v}"
          if [ "$built" != "$expected" ]; then
            echo "::error::tag $TAG expects version $expected but the binary reports $built"
            exit 1
          fi
          echo "verified: $built"

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 tgt-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the tarball
        run: |
          set -euo pipefail
          tarball="$(ls dist/tgt-*.tar.gz)"
          cosign sign-blob --yes --bundle "${tarball}.cosign.bundle" "$tarball"

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/tgt-*.tar.gz dist/tgt-*.cosign.bundle dist/SHA256SUMS --clobber
