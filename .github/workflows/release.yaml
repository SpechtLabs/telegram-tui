name: Release

# release-please keeps a release PR open against main, accumulating the
# conventional commits merged since the last tag. Merging that PR tags the
# release and publishes the notes; this workflow then builds a relocatable
# tarball for every published target, attaches them, and updates the Homebrew
# tap.
#
# Versioning is pre-1.0 (see .release-please-config.json): breaking changes
# bump the minor, everything else bumps the patch.
#
# ## THE PATH OF THIS FILE IS LOAD-BEARING — do not rename or move it
#
# Releases are signed keyless through GitHub OIDC, and the identity baked
# into the certificate is this file's path, ending in `@refs/heads/main` —
# see the `build` job's `SIGNING_IDENTITY` env var below for the exact
# string. Not restated here: a comment is the one copy nothing can check,
# so this points at the checked copy instead of holding one of its own
# (scripts/check-release-identity.sh verifies that copy against the
# `SIGNING_IDENTITY` constant in crates/app/src/update.rs).
#
# `tgt update --require-signature` pins that same string exactly. The pin
# is the whole check: `cosign verify-blob` given only --bundle proves that
# *somebody* signed the blob, not who.
#
# Renaming this file therefore breaks signature verification for every client
# built before the rename, and the failure lands far from the cause — users
# get "signature verification failed" on a perfectly good release, which
# reads as tampering. If it must move, change that constant in the same
# commit and expect older clients to stop verifying newer releases.
#
# Note the identity ends in `@refs/heads/main`, not the tag. The build job
# checks out the tag, but OIDC asserts the ref the *run* was triggered on,
# and release-please triggers it by pushing to main. Deriving the identity
# from the tag looks obviously right and is rejected by every real release —
# confirmed by decoding a published bundle's certificate.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build or repair (e.g. v0.2.0)
        required: true
        type: string
      force_rebuild:
        description: >-
          Rebuild every target even if its published assets already verify.
          Only for a target built from a bad commit — an ordinary repair
          (missing SHA256SUMS, a failed Homebrew push) does not need this;
          see the build job's "Decide" step for why the default matters.
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

# A new push supersedes the run in flight. The build matrix is not cheap even
# when it is free — macOS runners bill at 10x on private repos — and a
# superseded run proves nothing about the current head. (Windows is not part
# of what this run waits on — see windows-ci.yml and task #75.)
# Releases are exempt: cancelling one half-way could leave a tag published
# with no binary attached to it.
# Every run gets a group nothing else can occupy: a repair is keyed by the tag
# it rebuilds, a push by its own commit. Neither can evict the other, and two
# pushes cannot evict each other.
#
# That is deliberate rather than lax, and it was learned twice. With
# cancel-in-progress false GitHub still keeps only ONE *pending* run per group,
# so a shared group means a newer run evicts a waiting one. v0.1.4's repair was
# cancelled that way twice before it ran a single job. Then v0.1.5 was worse:
# release-please had already created the tag when a later push evicted the
# queued run, publishing a tag with zero assets — the exact outcome the
# original "releases are exempt from cancellation" note was written to prevent,
# arriving through eviction rather than cancellation.
#
# The cost is that two release runs can now overlap on rapid pushes. That is
# the cheaper failure: release-please reconciles its own PR and only one push
# ever creates a release, whereas an evicted run leaves a published tag with
# nothing attached and needs a manual repair to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    needs: [ci]
    if: github.event_name == 'push'
    steps:
      # release-please-action acts on the repository's CURRENT state via the
      # GitHub API, not on the commit this run's own `push` event checked
      # out — so a run that spent a while queued behind `ci` can wake up
      # after a *later* push has already been merged, see that merge, and
      # tag a release on behalf of a head that isn't its own. The newer
      # run's own release-please step then runs moments later, finds the
      # release already exists, and reports release_created=false — which
      # skips Build/Checksums/Homebrew for the run that is actually current.
      # v0.1.6 shipped intact only because the stale run's Build job checks
      # out the *tag* rather than its own head, so it happened to build the
      # right source anyway; a different ordering would have shipped a
      # third empty tag (the first two are why the group below exists at
      # all).
      #
      # This does not re-serialize pushes against each other — that
      # tradeoff was made deliberately when the concurrency group below
      # moved to per-sha groups, precisely so overlap is possible — it only
      # stops an overlapping run from acting once it is no longer the one
      # that matters. A run whose head is no longer main's tip by the time
      # it reaches this point steps aside instead of racing the run that
      # superseded it; that later run will find itself current when it gets
      # here and do the work. The normal, single-push case is unaffected —
      # main has not moved since this run's own push triggered it, so the
      # check passes and everything below proceeds exactly as before. The
      # window this narrows (a few seconds between this check and the next
      # step) rather than closes: release-please has no notion of "as of an
      # older commit", only "as of now", so nothing shy of serializing every
      # push closes it completely, and that cost was already rejected.
      - name: Refuse to act unless this run's head is still main's tip
        id: still-current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          if [ "$tip" = "${{ github.sha }}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved to $tip since this run started at ${{ github.sha }}; leaving release-please to that run."
          fi

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please
        if: steps.still-current.outputs.current == 'true'
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-type "simple" bumps Cargo.toml's `[workspace.package]`
      # version through `extra-files`' generic marker-comment replace
      # (`# x-release-please-version`, see Cargo.toml), but has no idea
      # Cargo.lock exists — it is a generated file and cannot carry that
      # marker — so nothing keeps the two in sync. Left alone, every release
      # dirties Cargo.lock for the next clone until someone notices and
      # regenerates it by hand (1572d33, and it will recur).
      #
      # release-please's own "rust" strategy looks like the fix and was
      # checked against its source rather than assumed: its Cargo.toml
      # updater requires a `[package]` table and throws
      # ("might be a cargo workspace") on a virtual manifest like this
      # repo's root Cargo.toml, which has only `[workspace.package]`. Making
      # it work would mean reconfiguring every crate as its own
      # release-please package plus the cargo-workspace plugin — and that
      # plugin's own updater writes a literal `package.version` string,
      # which on a crate using `version.workspace = true` (every crate here)
      # would silently replace the inheritance with a hardcoded version
      # instead of leaving it alone. Both risks are worse than a dirty lock
      # file, so this stays release-type "simple" and gets a regeneration
      # step instead — the honest fix when a generated file cannot carry the
      # annotation the "correct" mechanism needs.
      #
      # `cargo update --workspace` cannot touch anything outside the three
      # workspace members: every other dependency in this repo is pinned
      # exactly (`=x.y.z` throughout the three Cargo.toml files), which
      # forces cargo to that exact resolution regardless of what a plain
      # `update` would otherwise prefer. So this step's only possible effect
      # is syncing tgt-core/tgt-ui/tgt-app's own Cargo.lock entries to the
      # version release-please just wrote above them.
      #
      # Pushing straight to the PR branch with the default GITHUB_TOKEN
      # rather than opening a second PR: release-please already owns this
      # branch, and a bot-authored push to it does not re-trigger ci.yml's
      # `pull_request` job (GitHub does not fire `synchronize` for
      # GITHUB_TOKEN pushes, to prevent workflow loops) — acceptable here
      # since a lock-file sync following an already-checked version bump
      # cannot change what fmt/lint/test would report.
      # The PR JSON goes through the environment, never interpolated into the
      # shell. `${{ }}` substitution happens before bash parses the line, so
      # embedding that JSON in a quoted string means the changelog's own text
      # becomes syntax. This release proved it: the 0.2.0 breaking-change note
      # contains "a user's own OTLP collector", whose apostrophe closed the
      # single quote and left the next `(` unquoted —
      #
      #   syntax error near unexpected token `('
      #
      # The step failed, the Cargo.lock sync below never ran, and PR #8 sat
      # with a lock still saying 0.1.7. An env var is passed as data, so no
      # release note can ever be parsed as code again.
      - name: Extract the release PR's branch
        id: release-branch
        if: steps.release-please.outputs.prs_created == 'true'
        env:
          RELEASE_PR_JSON: ${{ steps.release-please.outputs.pr }}
        run: echo "name=$(jq -r '.headBranchName' <<< "$RELEASE_PR_JSON")" >> "$GITHUB_OUTPUT"

      - name: Checkout the release PR branch
        if: steps.release-please.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release-branch.outputs.name }}

      - name: Install mise
        if: steps.release-please.outputs.prs_created == 'true'
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.6.10
          install: true
          cache: true

      - name: Sync Cargo.lock with the version bump
        if: steps.release-please.outputs.prs_created == 'true'
        run: |
          set -euo pipefail
          cargo update --workspace
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already in sync; nothing to push."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore: sync Cargo.lock with the version bump above'
          git push origin "HEAD:${{ steps.release-branch.outputs.name }}"
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runs_on }}
    needs: [ci, release-please]
    if: >-
      always() &&
      needs.ci.result == 'success' &&
      (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    # Every row runs on a runner of its own architecture, so nothing here is a
    # cross-compile. That is deliberate rather than incidental: package.sh ends
    # by *executing* the packaged binary from a moved directory, and a
    # cross-built artifact could only be inspected, not run. `cross` would have
    # bought us aarch64 Linux from an x86_64 host at the cost of that proof,
    # and GitHub now hosts arm64 Linux and Intel macOS images directly.
    #
    # tdlib-rs's `download-tdlib` publishes a prebuilt TDLib for exactly these
    # four (plus android and windows) — see its build.rs and the v1.4.0 release
    # assets — so each row has a library to download. Windows is built and
    # tested in its own workflow, windows-ci.yml — not called from here, and
    # not in `needs` below, precisely so this job never waits on it (task
    # #75) — but ships no artifact regardless: its loader has no rpath
    # equivalent, so the relocatable layout below has no Windows spelling, and
    # nobody has run the client there.
    strategy:
      # A release is all-or-nothing downstream — the Homebrew formula needs a
      # checksum for every target — but seeing which targets broke beats
      # cancelling the survivors and guessing.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runs_on: macos-15
          - target: x86_64-apple-darwin
            runs_on: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runs_on: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runs_on: ubuntu-24.04-arm
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      TARGET: ${{ matrix.target }}
      # Mirrors `crates/app/src/update.rs`'s `SIGNING_IDENTITY`/`OIDC_ISSUER`
      # exactly — this is the same check `tgt update --require-signature`
      # runs on a client, used here to answer "is what's already published
      # for this target still good" before deciding whether to touch it. If
      # either constant ever changes there, it has to change here too, or a
      # repair would start "verifying" its own tarballs against a check no
      # client actually performs.
      SIGNING_IDENTITY: https://github.com/SpechtLabs/telegram-tui/.github/workflows/release.yaml@refs/heads/main
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      # Moved ahead of the build: the "Decide" step below needs it to check
      # whatever this target already has published, before any of the
      # expensive work below runs.
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # Downloads whatever this target currently has on the release, if
      # anything — a fresh `push` release, or a repair of a target that
      # never got built, will simply find nothing. Non-fatal either way:
      # this step's only job is to leave `dist/` populated (or not) for
      # "Decide" to inspect next.
      - name: Fetch this target's currently published assets, if any
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" \
            -p "tgt-*-${TARGET}.tar.gz" \
            -p "tgt-*-${TARGET}.tar.gz.cosign.bundle" \
            -D dist --clobber \
            || echo "nothing published for $TARGET yet"

      # THE FIX (task #73): a repair used to rebuild every target
      # unconditionally, even though the build is not reproducible — two
      # repairs of v0.1.4 produced two different sha256 sums for the same
      # target from the same tag. That meant every repair republished
      # different bytes than whatever a user may have already downloaded,
      # and — because the tarball and its cosign bundle upload as two
      # separate API calls seconds apart, see "Attach artifacts" below —
      # created a real window where a client could fetch a new tarball
      # paired with the previous run's bundle and see a signature failure
      # that reads as tampering.
      #
      # Most repairs need none of that: v0.1.4's two repairs existed only to
      # produce SHA256SUMS and push the Homebrew formula, not to change a
      # single built byte. So a target whose published (tarball, bundle)
      # pair already verifies — the exact check a real client performs —
      # is left alone entirely: not rebuilt, not re-signed, not
      # re-uploaded. Every step below that does real work is gated on
      # `skip_build`.
      #
      # Deliberately not cross-referenced against SHA256SUMS: v0.1.4 proved
      # that file can be the very thing missing, so "the sums file agrees"
      # cannot be the test for "the tarball is fine". `cosign verify-blob`
      # against the bundle checks the tarball's actual bytes on its own —
      # a truncated or corrupted upload fails it the same way a genuinely
      # tampered one would, which a mere "does a file with this name
      # exist" check would not catch.
      - name: Decide whether to rebuild this target
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::force_rebuild requested; rebuilding $TARGET unconditionally."
            exit 0
          fi

          shopt -s nullglob
          tarballs=(dist/tgt-*-"${TARGET}".tar.gz)
          bundles=(dist/tgt-*-"${TARGET}".tar.gz.cosign.bundle)

          if [ "${#tarballs[@]}" -ne 1 ] || [ "${#bundles[@]}" -ne 1 ]; then
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no complete (tarball, bundle) pair published yet for $TARGET; building."
            exit 0
          fi

          if cosign verify-blob --bundle "${bundles[0]}" \
              --certificate-identity "$SIGNING_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" \
              "${tarballs[0]}"; then
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TARGET's published assets already verify; skipping rebuild."
          else
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$TARGET's published assets exist but failed signature verification (a truncated or corrupted upload, most likely); rebuilding."
            rm -f "${tarballs[0]}" "${bundles[0]}"
          fi

      - name: Install mise
        if: steps.decide.outputs.skip_build != 'true'
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.6.10
          install: true
          cache: true

      # libc++ is TDLib's own C++ runtime (see the note in ci.yml); the linker
      # needs it present to resolve libtdjson's dependencies, and package.sh
      # copies it into the tarball so users do not. patchelf is what gives the
      # copies a $ORIGIN runpath of their own.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux' && steps.decide.outputs.skip_build != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++1 libc++abi1 patchelf

      # Deliberately a different key from ci.yml's. Sharing one means restoring
      # ~1.3 GB of debug artifacts this job cannot use, and then skipping the
      # save because CI already claimed the key, so target/ would never persist
      # across releases. The target triple is in the key because each row has
      # its own target/<triple>/ tree and its own downloaded TDLib.
      - name: Cache cargo registry and release target
        if: steps.decide.outputs.skip_build != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ matrix.target }}-

      # Builds the release binary, lays out bin/ + lib/, makes the loader path
      # relative to the executable, and proves the result runs from a moved
      # directory before it is allowed to ship (architecture.md §9.2).
      #
      # This is the step that invokes cargo, so it is the step the Sentry DSN
      # has to be on: crash.rs reads it through `option_env!`, which is a
      # compile-time read. .mise.toml carries the same value as a committed
      # default and defers to this one when it is set, so an absent or empty
      # secret is a normal state and not a failure — it just means releases
      # report to the committed project rather than to a retargeted one.
      # Never echo it: the value must not reach the log.
      - name: Package
        if: steps.decide.outputs.skip_build != 'true'
        env:
          TGT_SENTRY_DSN: ${{ secrets.TGT_SENTRY_DSN }}
        run: mise run package

      # A tag whose binary reports a different version means the Cargo.toml
      # bump did not land. Fail loudly rather than shipping a mislabeled
      # artifact.
      - name: Verify binary version matches the tag
        if: steps.decide.outputs.skip_build != 'true'
        run: |
          set -euo pipefail
          built="$(dist/tgt/bin/tgt --version | awk '{print $2}')"
          expected="${TAG#v}"
          if [ "$built" != "$expected" ]; then
            echo "::error::tag $TAG expects version $expected but the binary reports $built"
            exit 1
          fi
          echo "verified: $built"

      # One line per target, aggregated into a single SHA256SUMS later and read
      # again by the Homebrew job. Only the digests travel between jobs; the
      # tarballs go straight to the release.
      - name: Checksum
        if: steps.decide.outputs.skip_build != 'true'
        run: |
          set -euo pipefail
          cd dist
          tarball="$(ls tgt-*-${TARGET}.tar.gz)"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$tarball" > "${TARGET}.sha256"
          else
            shasum -a 256 "$tarball" > "${TARGET}.sha256"
          fi
          cat "${TARGET}.sha256"

      # The `skip_build` twin of "Checksum" above: the tarball already sitting
      # in `dist/` is the one "Fetch this target's currently published
      # assets" downloaded and "Decide" just proved still verifies, so this
      # only has to hash it — SHA256SUMS still needs every target's line
      # whether or not that target was actually rebuilt this run.
      - name: Checksum the already-verified tarball
        if: steps.decide.outputs.skip_build == 'true'
        run: |
          set -euo pipefail
          cd dist
          tarball="$(ls tgt-*-${TARGET}.tar.gz)"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$tarball" > "${TARGET}.sha256"
          else
            shasum -a 256 "$tarball" > "${TARGET}.sha256"
          fi
          cat "${TARGET}.sha256"

      # Unconditional: `dist/${TARGET}.sha256` exists either way, written by
      # whichever of the two "Checksum" steps above actually ran. The
      # `checksums` job needs a line from every target regardless of which
      # ones this run rebuilt.
      - name: Upload checksum for the aggregate and the formula
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checksum-${{ matrix.target }}
          path: dist/${{ matrix.target }}.sha256
          if-no-files-found: error

      # `skip_build`'s whole point: a target "Decide" left alone already has
      # a valid (tarball, bundle) pair on the release — re-signing here
      # would produce a *different*, equally valid signature over the same
      # bytes and then re-upload it for no reason, which is exactly the
      # unnecessary churn this task exists to stop. Cosign was installed
      # earlier in this job (before "Decide", which needs it too).
      - name: Sign the tarball
        if: steps.decide.outputs.skip_build != 'true'
        run: |
          set -euo pipefail
          tarball="$(ls dist/tgt-*-"${TARGET}".tar.gz)"
          cosign sign-blob --yes --bundle "${tarball}.cosign.bundle" "$tarball"

      # Also gated: this is the step whose two-files-seconds-apart upload
      # created the tarball/bundle mismatch window task #73 exists to close
      # (module docs above). Skipping it entirely for an already-verified
      # target means that window simply never opens for that target on this
      # run — nothing is re-clobbered, so there is nothing to be caught
      # between.
      - name: Attach artifacts to the release
        if: steps.decide.outputs.skip_build != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            dist/tgt-*-"${TARGET}".tar.gz \
            dist/tgt-*-"${TARGET}".tar.gz.cosign.bundle \
            --clobber

  checksums:
    name: Checksums
    runs-on: ubuntu-24.04
    needs: [release-please, build]
    if: always() && needs.build.result == 'success'
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      # This is the only job here that never checks the repository out — it
      # only needs the uploaded checksum artifacts. `gh` otherwise infers the
      # repository from a git remote, so without this it fails with "not a git
      # repository" and takes the Homebrew job down with it (v0.1.4 shipped
      # eight assets and no SHA256SUMS that way). Setting GH_REPO is cheaper
      # than adding a checkout purely to give `gh` something to read.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the per-target checksums
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: checksum-*
          merge-multiple: true
          path: checksums

      - name: Build SHA256SUMS
        run: |
          set -euo pipefail
          cat checksums/*.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Attach SHA256SUMS to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" SHA256SUMS --clobber

  homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-24.04
    # Waits on checksums so a release never ends up advertised by a formula it
    # has no published SHA256SUMS for.
    needs: [release-please, build, checksums]
    if: always() && needs.checksums.result == 'success'
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Download the per-target checksums
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: checksum-*
          merge-multiple: true
          path: checksums

      # The default GITHUB_TOKEN is scoped to this repository and cannot push to
      # another one, so the tap needs its own credential. Same secret name the
      # other SpechtLabs projects hand to goreleaser's homebrew_casks block.
      - name: Checkout the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SpechtLabs/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: tap

      # A repair can target any previously published tag, not only the
      # newest — that is the entire point of task #73, "repair" and
      # "rebuild the latest release" are different operations. Repairing
      # v0.1.4 to prove the skip_build logic worked, after v0.1.5 had
      # already shipped, regenerated and pushed the formula *for v0.1.4*,
      # clobbering the live v0.1.5 formula until v0.1.6 happened to
      # overwrite it again — every `brew install` in between silently
      # downgraded. This job had no notion that the tag it is building
      # might be older than what the tap already advertises, so it never
      # checked before writing.
      #
      # Compared against the tap's own currently-published version, not
      # "the latest GitHub release": the tap is what this job is actually
      # about to overwrite, reading it needs nothing beyond the checkout
      # above, and it sidesteps a second query's own edge cases (drafts,
      # prereleases, which "release" the API calls latest).
      #
      # `sort -V` (GNU version sort) rather than a lexical compare:
      # versions here are plain MAJOR.MINOR.PATCH (.release-please-
      # config.json), and lexical comparison ranks "0.9.0" above "0.10.0" —
      # checked with `printf '0.9.0\n0.10.0\n' | sort -V` rather than
      # assumed. No override input for "I genuinely want to push an older
      # formula than what's live": that case is real but vanishingly rare,
      # and better done by hand against the tap directly than handed a CI
      # input nobody would reach for except by mistake.
      - name: Refuse to downgrade the tap
        id: tap-guard
        run: |
          set -euo pipefail
          current_version=""
          if [ -f tap/Formula/tgt.rb ]; then
            current_version="$(sed -n 's/^ *version "\(.*\)"$/\1/p' tap/Formula/tgt.rb)"
          fi
          this_version="${TAG#v}"
          if [ -z "$current_version" ] ||
             [ "$(printf '%s\n%s\n' "$current_version" "$this_version" | sort -V | tail -1)" = "$this_version" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::the tap already advertises $current_version, newer than $this_version being built here; leaving the formula alone."
          fi

      - name: Generate the formula
        if: steps.tap-guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          ./scripts/brew-formula.sh "${TAG#v}" checksums > tap/Formula/tgt.rb
          cat tap/Formula/tgt.rb

      - name: Commit and push
        if: steps.tap-guard.outputs.skip != 'true'
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "telegram-tui release"
          git config user.email "bot@specht-labs.de"
          git add Formula/tgt.rb
          if git diff --cached --quiet; then
            echo "formula is already up to date for $TAG"
            exit 0
          fi
          git commit -m "chore(formula): update tgt to $TAG"
          git push
