name: Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docs/**/*
      - .markdownlint-cli2.yaml
      - .github/workflows/docs-website.yaml
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - docs/**/*
      - .markdownlint-cli2.yaml
      - .github/workflows/docs-website.yaml

jobs:
  md:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "docs/**/*.md"

  build:
    runs-on: ubuntu-latest
    name: Build (Docs)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `mise run docs-build` is the single definition of how this site is
      # built, .mise.toml's own comment on the `bun` pin says as much ("so
      # `mise run docs-lint` and `mise run docs-build` locally are exactly
      # what CI does") -- it just was not true here. This job ran a second,
      # bare `bun install && bun run build` that never called
      # docs-install-script or docs-copy-demo-cast, so the site this
      # workflow deployed never had install.sh or demo.cast copied into
      # public/ before `vuepress build` ran. Both URLs 404ed in production;
      # every install tested tonight happened to use raw.githubusercontent.com
      # instead of the advertised tgt.specht-labs.de/install.sh, which is
      # the only reason nobody had seen it. Installing mise and calling the
      # task fixes it at the one place the copy step is defined, rather
      # than teaching bun run build to duplicate that definition -- the
      # same reasoning that already governs this whole repo's cargo-facing
      # workflows (ci.yml, release.yaml, windows-ci.yml all call mise
      # tasks rather than raw cargo/bun invocations).
      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.6.10
          install: true
          cache: true

      - name: Build
        run: mise run docs-build

      - name: Upload Artifacts
        # Only the deploy job consumes this, and it runs on push/dispatch.
        # Skipping the upload on PRs avoids spending Actions artifact storage on
        # builds that never deploy.
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs/.vuepress/dist
          retention-days: 1

  deploy-static-pages:
    runs-on: ubuntu-latest
    needs:
      - build
      - md
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    permissions:
      id-token: write
      pages: write
    steps:
      - name: Download Artifacts for Website
        uses: actions/download-artifact@v8
        with:
          name: docs
          path: ./dist

      - name: Upload to Static Pages
        uses: SpechtLabs/StaticPages-Upload@main
        with:
          endpoint: https://pages.specht-labs.de
          site-dir: dist/
