name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable so the release pipeline gates on the exact same checks rather
  # than a second copy of them.
  workflow_call:

permissions:
  contents: read

# A new push supersedes the run in flight. The three-platform matrix is not
# cheap even when it is free — macOS runners bill at 10x and Windows at 2x on
# private repos — and a superseded run proves nothing about the current head.
# Releases are exempt: cancelling one half-way could leave a tag published
# with no binary attached to it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation is a pure cost on a runner: every job starts from a
  # restored cache and compiles once, so nothing is ever recompiled to benefit
  # from it — but it emits by far the most files in target/, which is what the
  # cache has to tar up afterwards. Leaving it on cost the Windows job 8+
  # minutes in "Post Cache" alone (Git's tar.exe is punishingly slow over many
  # small files) for artifacts no later step reads.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    # macOS and Linux both ship release artifacts (see release.yaml), on both
    # architectures. Windows is built and tested here and nowhere else: its
    # loader has no rpath equivalent, so the relocatable bin/ + lib/ layout the
    # release depends on has no Windows spelling, and nobody has run the client
    # there. Building it anyway catches a port regression at the point it is
    # introduced. A failure on any of the three is a real failure — an ignored
    # job would be worse than no job.
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.6.10
          install: true
          cache: true

      # The prebuilt TDLib that `download-tdlib` fetches for Linux is linked
      # against LLVM's libc++, which the Ubuntu image does not ship, so every
      # binary that loads it dies with "libc++.so.1: cannot open shared object
      # file". This is a real runtime dependency for Linux users too, not a CI
      # quirk — see the platform note in README.md.
      - name: Install libc++ (Linux TDLib runtime dependency)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libc++1 libc++abi1

      # Defender scans every file synchronously as it is written, and a debug
      # build of this workspace writes hundreds of thousands of small ones
      # (rlibs, object files, fingerprints, dep-info). That tax is the single
      # largest reason the Windows job takes multiples of the Linux one for
      # identical work. Excluding the two directories cargo writes into is the
      # standard mitigation; it applies only to this ephemeral runner, which is
      # destroyed after the job, and only to paths we produce ourselves.
      - name: Exclude the cargo directories from Defender
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionProcess "rustc.exe"
          Add-MpPreference -ExclusionProcess "cargo.exe"

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/debug/incremental
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Each gate is its own step so a failure names itself in the UI. The
      # commands live in .mise.toml, so `mise run check` locally runs exactly
      # this set.
      - name: Formatting
        run: mise run fmt-check

      - name: Clippy
        run: mise run lint

      - name: Tests
        run: mise run test

      # A bash script reading `cargo tree`. The forbidden edges are the same
      # everywhere, so running it once is the whole signal; the other two
      # would only add shell-portability failures that say nothing about the
      # dependency graph.
      - name: Crate boundaries
        if: matrix.os == 'ubuntu-latest'
        run: mise run boundaries

      - name: Pending snapshots
        run: mise run snapshots
