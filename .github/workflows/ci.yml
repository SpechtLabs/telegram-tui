name: CI

on:
  pull_request:
  # Callable so the release pipeline gates on the exact same checks rather
  # than a second copy of them.
  #
  # Deliberately no `push` trigger. release.yaml already runs on every push to
  # main and calls this workflow, so a push trigger here ran the whole
  # matrix a second time against the identical commit — doubling the queue,
  # and the wait, for no extra signal. Pushes to main are covered by the CI
  # job inside the Release run; pull requests are covered here directly.
  # (windows-ci.yml is the exception: it has its own direct `push` trigger,
  # since it is never called from release.yaml — see the `check` job below.)
  workflow_call:

permissions:
  contents: read

# A new push supersedes the run in flight. The matrix is not cheap even when
# it is free — macOS runners bill at 10x on private repos — and a superseded
# run proves nothing about the current head.
# Releases are exempt: cancelling one half-way could leave a tag published
# with no binary attached to it.
#
# The literal `ci` in the group is load-bearing, not decoration. Inside a
# workflow called by another, `github.workflow` resolves to the *caller's*
# name, so release.yaml's `uses: ./.github/workflows/ci.yml` made this
# expression evaluate to `Release-<ref>` — the exact group the parent run
# already holds. The child then waited on a lock only the parent could
# release, and GitHub killed the run:
#
#   Canceling since a deadlock was detected for concurrency group
#   'Release-refs/heads/main' between a top level workflow and 'CI'
#
# Every release since the matrix landed died that way, whatever the tests
# said. Keeping a segment that the caller cannot collide with is what stops
# it recurring; it also keeps a called run from fighting the standalone run
# of the same commit.
#
# That fixed the deadlock and moved the collision one level down rather than
# removing it: every called run still shared `github.ref` too, so any two
# push-triggered release runs' nested CI calls landed in the identical group
# `Release-ci-refs/heads/main` regardless of which commit each was for. With
# only one *pending* run kept per group, a second push's nested CI evicted
# the first's before it started — run 30669666816 was cancelled with zero
# jobs run this way. `github.sha` is unique per commit, so keying on it for
# anything that is not a `pull_request` gives every push's nested CI call its
# own group, the same way release.yaml's own top-level group already does
# for pushes. `pull_request` keeps `github.ref`: re-pushing to the same PR
# branch is *supposed* to supersede the run already checking that branch,
# which is exactly what `cancel-in-progress` below does for it.
#
# This does not chase the tag-repair case release.yaml's own group handles
# (`inputs.tag`, so two repairs of the same tag collide with each other by
# design, not by accident): a `workflow_dispatch` repair only reaches this
# nested call after release.yaml's own group has already let it through, so
# two repairs of the same tag never have their nested CI calls running
# concurrently in the first place — there is nothing left here for `sha` to
# get wrong for that case.
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation is a pure cost on a runner: every job starts from a
  # restored cache and compiles once, so nothing is ever recompiled to benefit
  # from it — but it emits by far the most files in target/, which is what the
  # cache has to tar up afterwards. Leaving it on cost the Windows job (now
  # windows-ci.yml, same setting there) 8+ minutes in "Post Cache" alone
  # (Git's tar.exe is punishingly slow over many small files) for artifacts no
  # later step reads.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    # macOS and Linux both ship release artifacts (see release.yaml), on both
    # architectures.
    #
    # Windows is checked in its own workflow, windows-ci.yml, not this
    # matrix — it used to be a third entry here behind `continue-on-error`,
    # which stopped a red Windows job *failing* a release but not *delaying*
    # one. release.yaml's `build` job needs this whole workflow_call to
    # finish, and a called workflow does not report done until every job
    # inside it does, `continue-on-error` or not; Windows is reliably the
    # slowest leg (Defender + NTFS overhead, see windows-ci.yml), so every
    # release and every repair waited on a platform that ships no artifact
    # and gates nothing. windows-ci.yml has its own `pull_request` and `push`
    # triggers — same events this matrix runs on — so a Windows regression is
    # still caught at the commit that introduced it; it is simply no longer
    # something release.yaml's `build` job needs to wait for.
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.6.10
          install: true
          cache: true

      # The prebuilt TDLib that `download-tdlib` fetches for Linux is linked
      # against LLVM's libc++, which the Ubuntu image does not ship, so every
      # binary that loads it dies with "libc++.so.1: cannot open shared object
      # file". This is a real runtime dependency for Linux users too, not a CI
      # quirk — see the platform note in README.md.
      - name: Install libc++ (Linux TDLib runtime dependency)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libc++1 libc++abi1

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/debug/incremental
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Each gate is its own step so a failure names itself in the UI. The
      # commands live in .mise.toml, so `mise run check` locally runs exactly
      # this set.
      - name: Formatting
        run: mise run fmt-check

      - name: Clippy
        run: mise run lint

      - name: Tests
        run: mise run test

      # A bash script reading `cargo tree`. The forbidden edges are the same
      # everywhere, so running it once is the whole signal; the other two
      # would only add shell-portability failures that say nothing about the
      # dependency graph.
      - name: Crate boundaries
        if: matrix.os == 'ubuntu-latest'
        run: mise run boundaries

      - name: Pending snapshots
        run: mise run snapshots
