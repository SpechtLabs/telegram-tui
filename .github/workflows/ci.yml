name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable so the release pipeline gates on the exact same checks rather
  # than a second copy of them.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Checks
    # aarch64-apple-darwin is the only supported target (spec §2), so the
    # gates run where the code actually ships.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.6.10
          install: true
          cache: true

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Each gate is its own step so a failure names itself in the UI. The
      # commands live in .mise.toml, so `mise run check` locally runs exactly
      # this set.
      - name: Formatting
        run: mise run fmt-check

      - name: Clippy
        run: mise run lint

      - name: Tests
        run: mise run test

      - name: Crate boundaries
        run: mise run boundaries

      - name: Pending snapshots
        run: mise run snapshots
