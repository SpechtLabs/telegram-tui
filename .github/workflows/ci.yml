name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          version: 2026.6.10
          install: true
          cache: true

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: mise exec -- cargo fmt --all -- --check

      - name: cargo clippy
        run: mise exec -- cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: mise exec -- cargo test --workspace

      - name: crate boundary check
        run: mise exec -- ./scripts/check-crate-boundaries.sh
