name: Rust

# The workspace's gates: formatting, clippy, tests with coverage, pending
# snapshots, on both platforms that ship release artifacts, plus the
# repository lints. ci.yaml calls it for pull requests, release.yaml gates
# every release on it, and it runs on its own from the Actions tab.
#
# No concurrency group here, on purpose. Inside a called workflow
# `github.workflow` resolves to the *caller's* name, so a group here keyed on
# it evaluated to the group release.yaml's own run already held. The child
# then waited on a lock only the parent could release, and GitHub cancelled
# the run:
#
#   Canceling since a deadlock was detected for concurrency group
#   'Release-refs/heads/main' between a top level workflow and 'CI'
#
# Every release died that way until the group moved. The callers own
# concurrency now: ci.yaml at the workflow level, release.yaml on the job
# that calls this.
#
# Windows is checked in windows-ci.yaml, not here. A called workflow does not
# report done until every job inside it does, `continue-on-error` or not, and
# Windows is reliably the slowest leg, so every release waited on a platform
# that ships no artifact and gates nothing.
on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Each job installs the tools listed below with mise-action's install_args.
  # Without this, `mise run` installs every tool in .mise.toml first,
  # asciinema and the docs toolchain included.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  # mise itself, pinned. Unpinned, mise-action picks the newest release and
  # leaves it out of its cache key, so every new mise release finds an older
  # binary in the restored cache, warns that it failed integrity verification
  # and downloads it again.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.2
  # Every tool a Linux job runs. mise-action keys its cache on install_args,
  # so one list means one cache: main's runs save it and every pull request
  # restores it, rather than each job keeping a copy of its own subset. The
  # Rust toolchain itself lives outside mise's cache (see "Cache the Rust
  # toolchain"). macOS has a mise cache of its own anyway and installs only
  # what its steps run.
  MISE_TOOLS: rust cargo-insta aqua:taiki-e/cargo-llvm-cov yamllint actionlint shellcheck

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      - name: Lint YAML
        run: mise run yaml-lint

      # The matcher turns actionlint's output into annotations on the PR diff.
      # shellcheck is installed above, so the `run:` scripts are checked too.
      - name: Lint workflows
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          mise run actionlint

      # The update path's signing identity, written twice: in update.rs and in
      # release.yaml. A text check, so it needs no build.
      - name: Release identity
        run: mise run release-identity

  check:
    # macOS and Linux both ship release artifacts (see release.yaml), on both
    # architectures.
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # mise installs Rust with the runner's rustup, which keeps the toolchain
      # in ~/.rustup, outside mise's cache, and downloads it again on every
      # run without this. The key is the version .mise.toml pins. Every job
      # that installs Rust restores the toolchain the same way.
      - name: Read the pinned Rust version
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' .mise.toml)"
          components="$(sed -n 's/^rust = {.*components = "\([^"]*\)".*/\1/p' .mise.toml)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          # A cache key can't hold commas.
          echo "components=${components//,/-}" >> "${GITHUB_OUTPUT}"

      - name: Cache the Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.rust.outputs.version }}-*
            ~/.rustup/update-hashes/${{ steps.rust.outputs.version }}-*
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ steps.rust.outputs.components }}

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ runner.os == 'Linux' && env.MISE_TOOLS || 'rust cargo-insta' }}

      # The prebuilt TDLib that `download-tdlib` fetches for Linux is linked
      # against LLVM's libc++, which the Ubuntu image does not ship, so every
      # binary that loads it dies with "libc++.so.1: cannot open shared object
      # file". This is a real runtime dependency for Linux users too, not a CI
      # quirk — see the platform note in README.md.
      - name: Install libc++ (Linux TDLib runtime dependency)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libc++1 libc++abi1

      # rust-cache keys on the toolchain and the lockfile, and drops the
      # workspace's own build output before it saves, so the cache holds the
      # registry, the compiled dependencies and the downloaded TDLib. Only
      # main's run (release.yaml's gate) saves; pull requests restore it.
      # ~/.cargo/bin holds mise's rustup proxies, not anything cargo
      # installed, so it stays out. It also turns incremental compilation off,
      # which is a pure cost on a runner that compiles everything once.
      - name: Cache cargo registry and dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Each gate is its own step so a failure names itself in the UI. The
      # commands live in .mise.toml, so `mise run check` locally runs the
      # same set.
      - name: Formatting
        run: mise run fmt-check

      - name: Clippy
        run: mise run clippy

      # Linux runs the tests under cargo-llvm-cov for Codecov; macOS runs them
      # plainly. Same tests either way.
      - name: Tests
        if: runner.os != 'Linux'
        run: mise run test

      - name: Tests with coverage
        if: runner.os == 'Linux'
        run: mise run coverage

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          disable_search: true
          fail_ci_if_error: false

      # A bash script reading `cargo tree`. The forbidden edges are the same
      # everywhere, so running it once is the whole signal.
      - name: Crate boundaries
        if: runner.os == 'Linux'
        run: mise run boundaries

      - name: Pending snapshots
        run: mise run snapshots
