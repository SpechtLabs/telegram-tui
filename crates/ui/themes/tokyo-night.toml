# tokyo-night — https://github.com/folke/tokyonight.nvim ("night" variant,
# the scheme's default/canonical palette).
#
# Official hex values from the palette. Mapping: bg -> surface, bg_highlight
# -> surface_raised, fg -> text, comment -> text_muted, blue -> accent, blue0
# -> accent_dim (a darker, muted blue for the own-message rail), terminal_black
# -> selection, fg_gutter -> border (darker than comment, so it stays dimmer
# than text_muted). Sender palette: eight of the scheme's named accent hues.

accent = "#7aa2f7"         # blue
accent_dim = "#3d59a1"     # blue0
text = "#c0caf5"           # fg
text_muted = "#565f89"     # comment
surface = "#1a1b26"        # bg
surface_raised = "#292e42" # bg_highlight
success = "#9ece6a"        # green
warning = "#e0af68"        # yellow
danger = "#f7768e"         # red
selection = "#414868"      # terminal_black
rail_own = "#3d59a1"       # blue0 (= accent_dim)
rail_other = "#7aa2f7"     # blue (= accent)
border = "#3b4261"         # fg_gutter

sender_palette = [
    "#f7768e", # red
    "#ff9e64", # orange
    "#e0af68", # yellow
    "#9ece6a", # green
    "#7dcfff", # cyan
    "#7aa2f7", # blue
    "#9d7cd8", # purple
    "#bb9af7", # magenta
]
