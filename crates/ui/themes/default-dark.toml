# default-dark — telegram-tui's built-in dark theme.
#
# Verbatim port of `Theme::default_dark()` (crates/ui/src/theme/mod.rs): a
# desaturated slate surface with a blue accent. Every hex value here is the
# exact `Color::Rgb` triple that function used to hard-code, so switching to
# "default-dark" by name must render pixel-identical to the old baked-in
# default (docs/architecture.md §4.9).

accent = "#61afef"
accent_dim = "#3a698f"
text = "#dcdfe4"
text_muted = "#8c929c"
surface = "#181a20"
surface_raised = "#22252d"
success = "#98c379"
warning = "#e5c07b"
danger = "#e06c75"
selection = "#313b4f"
rail_own = "#3a698f"
rail_other = "#61afef"
border = "#343944"

sender_palette = [
    "#e06c75", # red
    "#d19a66", # orange
    "#e5c07b", # yellow
    "#98c379", # green
    "#56b6c2", # cyan
    "#61afef", # blue
    "#c678dd", # purple
    "#e082aa", # pink
]
