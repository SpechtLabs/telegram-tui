[package]
name = "tgt-app"
edition.workspace = true
version.workspace = true

[[bin]]
name = "tgt"
path = "src/main.rs"

[dependencies]
tgt-core = { workspace = true }
tgt-ui = { workspace = true }
async-trait = { workspace = true }
tdlib-rs = { version = "=1.4.0", default-features = false, features = ["download-tdlib"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "signal", "process"] }
crossterm = { version = "=0.29.0", features = ["event-stream"] }
ratatui = "=0.30.2"
clap = { version = "=4.6.4", features = ["derive"] }
color-eyre = "=0.6.5"
etcetera = "=0.11.0"
# Default features are deliberate and sufficient on all three platforms: the
# default `v1` feature turns on the Keychain store, the Windows Credential
# Manager store and the zbus Secret Service store together, and keyring gates
# each one's dependency to the platform it belongs to, so naming them per
# target here would only restate what keyring already does. On non-Apple unix
# the Secret Service store needs a provider running (gnome-keyring, KWallet,
# KeePassXC) — see `keychain::db_key`, which has no fallback for its absence.
keyring = "=4.1.5"
arboard = "=3.6.1"
rand = "=0.10.2"
serde = { workspace = true }
serde_json = { workspace = true }
toml = "=1.1.4"
tracing = { workspace = true }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "registry"] }
tracing-appender = "=0.2.5"
tracing-batteries = { git = "https://github.com/sierrasoftworks/tracing-batteries-rs.git", rev = "f059e936623c2eb0ca67f6ae3301487c9443ffd0", default-features = false, features = ["sentry"] }
# Named directly only to turn features on. `tracing-batteries` depends on
# sentry with `default-features = false`, which drops `panic`, `backtrace`,
# `contexts` and `debug-images` — i.e. everything that makes a *crash*
# reporter a crash reporter. Cargo unifies features across the graph, so
# listing sentry here at the version batteries already resolves adds the
# integrations without a second copy of the crate. The wiring still goes
# through the battery (`crash.rs`); this entry only widens the feature set.
# `reqwest` + `rustls` are the transport, matching batteries' own choice.
sentry = { version = "=0.48.5", default-features = false, features = ["panic", "backtrace", "contexts", "debug-images", "release-health", "reqwest", "rustls"] }
# The OTLP stack `tracing-batteries` also wraps, driven directly: its
# `OpenTelemetry` battery installs its own global subscriber and filters only
# by level, neither of which can coexist with the file log or the allowlist.
# Its `Sentry` battery has no such problem and *is* used. See otel.rs and
# crash.rs module docs. Versions match the ones batteries resolves, so
# nothing is duplicated.
opentelemetry = { version = "=0.32.0", default-features = false, features = ["logs"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["logs", "internal-logs"] }
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["logs", "http-proto", "http-json", "reqwest-blocking-client", "internal-logs"] }
opentelemetry-appender-tracing = "=0.32.0"
# Not used directly: it pins the TLS backend for the OTLP exporter's blocking
# HTTP client, which otherwise cannot talk to an https collector.
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }

# Wayland clipboard, which is not one of arboard's default features. Without it
# arboard only speaks X11, so a pure Wayland session with no XWayland has no
# clipboard at all and every yank fails. It is additive rather than a swap:
# arboard tries the Wayland protocol when `WAYLAND_DISPLAY` is set and falls
# back to X11 otherwise, or if the Wayland handshake fails. Stated per target
# because the feature pulls `wl-clipboard-rs`, which arboard makes available on
# non-Apple unix only.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
arboard = { version = "=3.6.1", features = ["wayland-data-control"] }

[dev-dependencies]
insta = { workspace = true }
tempfile = "=3.27.0"
axum = "=0.8.9"
opentelemetry-proto = { version = "=0.32.0", features = ["gen-tonic-messages", "trace", "logs"] }
prost = "=0.14.4"
