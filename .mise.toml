# .mise.toml — local tooling, exact pins (repo convention)
#
# The tasks below are the single definition of "how this project is built and
# checked". CI calls exactly these, so a green `mise run check` locally means a
# green pipeline. Renovate keeps every pin in this file current.

[settings]
# The pins below are the only source of tool versions. Without this, mise
# would also read rust-toolchain.toml (and an .nvmrc, should one appear) and
# could disagree with what CI installs.
idiomatic_version_file_enable_tools = []

[tools]
# Rust has to be pinned here as well as in rust-toolchain.toml: a global mise
# config may set `rust = "stable"`, and whichever mise config wins exports
# RUSTUP_TOOLCHAIN, which overrides rust-toolchain.toml. Without this entry the
# project would silently build on stable. rust-toolchain.toml stays so plain
# `cargo` outside a mise shell picks the same compiler; Renovate moves both in
# one PR. CI installs the minimal profile, so the components the lint and
# coverage tasks need are listed. The workflows read this line to key their
# toolchain cache, so keep it on one line.
rust = { version = "1.99.0", components = "rustfmt,clippy,llvm-tools" }
# Rust coverage for Codecov (see the coverage task); it needs the llvm-tools
# component above.
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
# Snapshot review workflow (see the snapshots task). A prebuilt binary: the
# cargo backend compiled it from source on every cold CI cache.
cargo-insta = "1.49.0"

# Pre-commit for Git hooks
pre-commit = "4.6.2"

# Linters for what isn't Rust (see the lint task).
yamllint = "1.38.0"
actionlint = "1.7.12"
# actionlint runs shellcheck on every `run:` script when it's on PATH, and
# silently skips them when it isn't.
shellcheck = "0.11.0"

# Pins GitHub Actions to commit SHAs (see the update-gha task)
pinact = "5.0.0"

# Documentation website (docs/): VuePress builds under bun, and the same
# markdownlint-cli2 version the docs workflow runs, so `mise run docs-lint`
# and `mise run docs-build` locally are exactly what CI does.
# markdownlint-cli2 is an npm package, which mise installs with this node.
bun = "1.4.2"
node = "24.21.0"
markdownlint-cli2 = "0.23.3"

# Records the `tgt --demo` asciinema cast committed alongside the demo driver
# script (see `crates/app/src/demo/`'s module docs and `scripts/record-demo.sh`).
# Not part of the build; a dev-time tool the same way pinact/cargo-insta are.
# It has no Windows build, which is one reason CI installs only the tools each
# job runs (install_args in the workflows) rather than everything here.
"aqua:asciinema/asciinema" = "3.2.1"

[env]
# Sentry crash reporting is compiled in from this variable (`option_env!`), so a
# build without it is inert. Committed rather than kept in a secret because a
# DSN is a public client key: it permits submitting events and nothing else, no
# read access, and it is meant to ship inside client binaries. Keeping it here
# means a contributor's build reports too — and `environment` is split on
# `debug_assertions`, so their debug runs land somewhere other than the
# production issue stream.
#
# The template is what makes the release workflow's TGT_SENTRY_DSN secret an
# override rather than a no-op: a plain assignment here would win over the
# inherited environment (verified — mise applies [env] on top of the process
# environment), so the secret would be silently ignored. An unset secret
# reaches the runner as an empty string rather than as nothing at all, and
# `{% if %}` treats both the same, so a missing secret falls back to the value
# below instead of baking in an empty DSN.
TGT_SENTRY_DSN = "{% if env.TGT_SENTRY_DSN %}{{ env.TGT_SENTRY_DSN }}{% else %}https://af72d07f6ba84fa2d7e3a932f2246fa5@o4510777486016512.ingest.de.sentry.io/4511831345463376{% endif %}"

# mise's rust backend keeps only a symlink in its own installs dir; the real
# toolchain lives in ~/.rustup, which mise-action does not cache. On a cache
# hit mise therefore reports "all tools are installed", skips the install that
# would add the components above, and the first cargo call makes rustup fetch a
# bare toolchain instead. `cargo fmt` then fails with "'cargo-fmt' is not
# installed for the toolchain" on exactly the CI runs that hit the cache. The
# workflows now cache ~/.rustup by the pinned version and components as well,
# but the two caches can still disagree (one evicted, the other not), so this
# task stays as the backstop: it is idempotent, costs nothing when the
# components are already present, and installs the toolchain if it is missing
# entirely.
[tasks.toolchain]
description = "Ensure the pinned toolchain has rustfmt, clippy and llvm-tools (idempotent)"
# `sh` is dash on Ubuntu (no `pipefail`) and cmd on Windows; pin bash so one
# body works on all three. Windows runners get it from Git for Windows.
shell = "bash -c"
run = '''
set -eu
channel="${RUSTUP_TOOLCHAIN:-$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)}"
rustup toolchain install "$channel" --component rustfmt --component clippy --component llvm-tools --no-self-update
'''

[tasks.fmt]
description = "Format the workspace"
depends = ["toolchain"]
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check formatting without writing (gate 1)"
depends = ["toolchain"]
run = "cargo fmt --all -- --check"

# The checking gates below blank TGT_SENTRY_DSN. `option_env!` reads it when
# the crate is compiled, not when it runs, so without this every `mise run
# test` would bake the production ingest key into a test binary and a
# panicking test could file a real issue. `crash.rs` treats an empty value the
# same as an absent one, so this is the "inert build" path it asserts on.
# A task-level `env` overrides both the [env] default above and anything
# inherited (verified), which is what makes the blanking reliable. `build`,
# `run` and `package` deliberately do not do this: those produce the artifacts
# that are meant to report.

[tasks.clippy]
description = "Clippy across every target, warnings are errors (gate 2)"
depends = ["toolchain"]
env = { TGT_SENTRY_DSN = "" }
run = "cargo clippy --workspace --all-targets -- -D warnings"

# CI runs the four as steps of their own, so a failure names itself; on
# macOS and Windows only the two Rust ones, since YAML and workflows read the
# same everywhere.
[tasks.lint]
description = "Every lint: rustfmt, clippy, YAML and workflows"
depends = ["fmt-check", "clippy", "yaml-lint", "actionlint"]

[tasks.yaml-lint]
description = "Lint every YAML file in the repository"
run = "yamllint --strict ."

[tasks.actionlint]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

[tasks.test]
description = "Run the whole test suite (gate 3)"
env = { TGT_SENTRY_DSN = "" }
run = "cargo test --workspace"

# The tests `test` runs, instrumented by cargo-llvm-cov, into one lcov report
# that CI uploads to Codecov. The instrumented build has a target directory
# of its own (target/llvm-cov-target), so it doesn't invalidate `test`'s.
[tasks.coverage]
description = "Run the test suite under cargo-llvm-cov and write lcov.info"
depends = ["toolchain"]
env = { TGT_SENTRY_DSN = "" }
run = "cargo llvm-cov --workspace --locked --lcov --output-path lcov.info"

[tasks.boundaries]
description = "Assert the crate dependency boundaries hold (gate 4)"
run = "./scripts/check-crate-boundaries.sh"

[tasks.release-identity]
description = "Assert crates/app/src/update.rs and the release workflow agree on SIGNING_IDENTITY/OIDC_ISSUER (gate 5)"
run = "./scripts/check-release-identity.sh"

[tasks.check]
description = "The definition of done: every gate CI runs"
depends = ["lint", "test", "snapshots", "boundaries", "release-identity"]

[tasks.snapshots]
description = "Fail on any pending insta snapshot (take them with `cargo insta accept`)"
env = { TGT_SENTRY_DSN = "" }
run = "cargo insta test --workspace --check"

[tasks.build]
description = "Release build of the tgt binary"
run = "cargo build --release -p tgt-app"

[tasks.run]
description = "Run the client from source"
run = "cargo run -p tgt-app"

[tasks.package]
description = "Build dist/ with the relocatable binary, its TDLib, and a tarball"
# Set TARGET to package for a rust triple other than the host's. The release
# workflow builds every published target on a runner of its own architecture,
# so it never has to.
run = "./scripts/package.sh"

# Unix-shaped: it lays out bin/ + ../lib for the @rpath/$ORIGIN loader, which
# is exactly the tree package.sh proves relocatable. Windows ships no artifact
# and has no rpath, so this is not made portable to it.
[tasks.install]
description = "Install tgt: a private tree under XDG_DATA_HOME, symlinked onto PATH"
depends = ["package"]
shell = "bash -c"
run = '''
set -eu
# The same layout scripts/install.sh and the Homebrew formula produce, and
# deliberately so: one layout, not three. bin/tgt reaches libtdjson through a
# runpath relative to itself, so the two must stay siblings — and keeping the
# tree private (rather than scattered into a shared $PREFIX/bin + $PREFIX/lib)
# is what lets `tgt update` replace it with a single atomic rename. A shared
# prefix cannot be updated atomically at all.
ROOT="${TGT_INSTALL_ROOT:-${XDG_DATA_HOME:-$HOME/.local/share}/tgt}"
BIN_DIR="${TGT_BIN_DIR:-$HOME/.local/bin}"
mkdir -p "$(dirname "$ROOT")" "$BIN_DIR"

staged="$ROOT.new-$$"
rm -rf "$staged"
cp -a dist/tgt "$staged"

previous=""
if [ -e "$ROOT" ]; then
  previous="$ROOT.old-$$"
  mv "$ROOT" "$previous"
fi
mv "$staged" "$ROOT"

# Keep the old tree until the new one proves it starts; `--version` exits
# before touching terminal modes, so it is safe to invoke.
if ! "$ROOT/bin/tgt" --version >/dev/null 2>&1; then
  rm -rf "$ROOT"
  if [ -n "$previous" ]; then
    mv "$previous" "$ROOT"
    echo "error: the newly built tgt could not start; previous install restored" >&2
  else
    echo "error: the newly built tgt could not start" >&2
  fi
  exit 1
fi
[ -n "$previous" ] && rm -rf "$previous"

ln -sfn "$ROOT/bin/tgt" "$BIN_DIR/tgt"
echo "installed $("$ROOT/bin/tgt" --version)"
echo "  $BIN_DIR/tgt -> $ROOT/bin/tgt"
case ":$PATH:" in
  *":$BIN_DIR:"*) ;;
  *) echo "note: $BIN_DIR is not on your PATH" >&2 ;;
esac
'''

[tasks.uninstall]
description = "Remove the tgt tree and its symlink"
shell = "bash -c"
run = '''
set -eu
ROOT="${TGT_INSTALL_ROOT:-${XDG_DATA_HOME:-$HOME/.local/share}/tgt}"
BIN_DIR="${TGT_BIN_DIR:-$HOME/.local/bin}"
rm -rf "$ROOT"
rm -f "$BIN_DIR/tgt"
echo "removed $ROOT and $BIN_DIR/tgt"
# Versions before the private-tree layout scattered files into
# $TGT_PREFIX/{bin,lib} (default ~/.local). Clean those too, naming exactly
# what the old task copied in rather than globbing a shared lib directory.
LEGACY="${TGT_PREFIX:-$HOME/.local}"
rm -f "$LEGACY/bin/tgt" \
      "$LEGACY"/lib/libtdjson* \
      "$LEGACY"/lib/libc++.so.1 \
      "$LEGACY"/lib/libc++abi.so.1 \
      "$LEGACY"/lib/libunwind.so.1
'''

[tasks.docs-lint]
description = "Lint the documentation markdown (the docs workflow's first job)"
run = "markdownlint-cli2 'docs/**/*.md'"

[tasks.docs-install-script]
description = "Copy scripts/install.sh into the docs site so it is served at /install.sh"
# One source of truth. scripts/install.sh is canonical and this copies it in;
# docs/.vuepress/public/ is gitignored for this file so nobody edits the copy
# and watches it drift. `base` is "/", so it lands at
# https://tgt.specht-labs.de/install.sh — the URL the README advertises.
run = "cp scripts/install.sh docs/.vuepress/public/install.sh"

[tasks.docs-copy-demo-cast]
description = "Copy assets/demo.cast into the docs site so the \"cast\" container can fetch it"
# Same reasoning as docs-install-script, one source of truth: assets/demo.cast
# is canonical, this copies it in, and docs/.vuepress/public/ is gitignored
# for the copy so nobody edits it in place. docs-kit's AsciinemaCast loads its
# `src` with a runtime `fetch()`, not a build-time import, so the file has to be
# reachable as a static asset under the site root — `base` is "/", so it
# lands at https://tgt.specht-labs.de/demo.cast.
run = "cp assets/demo.cast docs/.vuepress/public/demo.cast"

[tasks.docs-dev]
description = "Serve the documentation website locally with hot reload"
depends = ["docs-install-script", "docs-copy-demo-cast"]
run = "cd docs && bun install && bun run dev"

[tasks.docs-build]
description = "Build the documentation website (the docs workflow's second job)"
depends = ["docs-install-script", "docs-copy-demo-cast"]
run = "cd docs && bun install --frozen-lockfile && bun run build"

# Pins without moving versions; Renovate moves them afterwards. StaticPages-Upload
# tracks its main branch, pinned by hand like in the other SpechtLabs repos.
[tasks.update-gha]
description = "Pin GitHub Actions to commit SHAs (Renovate keeps them current afterwards)"
run = "pinact run -e 'SpechtLabs/StaticPages-Upload'"
